services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      # On Linux, make sure the host runs/ directory is writable by UID 1000.
      - ./runs:/app/runs
      - ./configs:/app/configs:ro
      - ./procedures:/app/procedures:ro
      # Set DATASET_HOST_DIR to the host folder containing dataset run folders.
      - ${DATASET_HOST_DIR:-./data}:/app/data:ro
      # A Docker-managed directory, initialized with the ownership of /app/db.
      - app_db:/app/db
    environment:
      PYTHONUNBUFFERED: "1"
      DB_DIR: /app/db
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
    # Do not override the image's appuser: UID 1000 must own /app/db.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  app_db:
