# docker-compose.yml
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports: ["8000:8000"]
    volumes:
      - ./app.db:/app/app.db
      - ./runs:/app/runs
      - ./configs:/app/configs:ro
      - ./procedures:/app/procedures:ro
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports: ["5173:80"]
    depends_on: [backend]